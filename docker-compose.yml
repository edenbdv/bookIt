services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookit
      POSTGRES_PASSWORD: bookit
      POSTGRES_DB: bookit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      APP_NAME: BookIt
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://bookit:bookit@db:5432/bookit
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/code
      - /code/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; exit(0 if u.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # BOOK-44: same image as `app`, different command -- a separate process/
  # container so it scales and restarts independently of the API. See
  # docs/jobs/worker-decisions.md section 6 ("does the worker ship in the
  # same image as the app?") and docs/jobs/background-jobs-basics.md's
  # "worker on a queue" section for why this isn't run inside `app` instead.
  #
  # Only CELERY_BROKER_URL for now -- BOOK-44's task (`ping`) touches no
  # database and no cache. DATABASE_URL/REDIS_URL get added here once
  # BOOK-45/BOOK-46 land real jobs that need them.
  worker:
    build: .
    command: uv run --no-dev celery -A app.worker worker --loglevel=info
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/code
      - /code/.venv

volumes:
  pgdata:
