# BOOK-63: every PR (and every push to main) is checked on a clean machine --
# lint, tests, and the Docker image build. Jobs run in parallel; any red one
# marks the PR red.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# a newer push to the same PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --locked: fail if uv.lock is out of date with pyproject.toml,
      # instead of silently resolving something different from local
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsc -b && vite build -- also the frontend's type check
      - run: npm run build

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # ubuntu runners ship with Docker, so testcontainers starts its own
      # Postgres/Redis exactly as it does locally -- no `services:` block
      # (docs/testing/testing-decisions.md §1)
      - run: uv run pytest

  build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # build only, no push -- proves each Dockerfile still builds
      - name: Booking image
        run: docker build -t bookit:ci .
      # BOOK-64: Notification's own image, built from the repo root because
      # the workspace uv.lock lives there
      - name: Notification image
        run: docker build -f services/notification/Dockerfile -t bookit-notification:ci .
      # it starts, and it really is separate: none of Booking's code or
      # Booking-only dependencies made it into the image
      - name: Notification image is self-contained
        run: >
          docker run --rm --entrypoint python bookit-notification:ci -c
          "import importlib.util as u, notification.__main__;
          leaked = [m for m in ('app', 'fastapi', 'celery') if u.find_spec(m)];
          assert not leaked, f'Booking code/deps in Notification image: {leaked}';
          print('ok: notification image is self-contained')"
      # BOOK-65: Payment's own image, built from the repo root like Notification's
      - name: Payment image
        run: docker build -f services/payment/Dockerfile -t bookit-payment:ci .
      # its app, scheduler and consumer all import, and it really is separate:
      # none of Booking's or Notification's code, no Booking-only dependencies
      - name: Payment image is self-contained
        run: >
          docker run --rm --entrypoint python bookit-payment:ci -c
          "import importlib.util as u, payment.main, payment.scheduler, payment.booking_consumer;
          leaked = [m for m in ('app', 'notification', 'celery', 'redis', 'bcrypt') if u.find_spec(m)];
          assert not leaked, f'Booking/Notification code or deps in Payment image: {leaked}';
          print('ok: payment image is self-contained')"
