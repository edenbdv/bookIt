<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="sans-serif">
<title id="t">Multi-level ix_properties_city B+Tree versus the properties table heap</title>
<desc id="d">A three level B+Tree: root and two branch nodes, each branch labeled with the cities it covers, leading to four leaves holding alphabetically ordered entries, pointing into an unsorted table heap with crossing pointer arrows.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="30" y="20" width="700" height="290" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
<text x="46" y="44" font-size="14" font-weight="bold" fill="#1e3a8a">ix_properties_city index</text>
<text x="46" y="60" font-size="12" fill="#3b5998">Sorted B+Tree, 3 levels</text>
<rect x="330" y="76" width="100" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="380" y="96" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0f172a">Root</text>
<line x1="350" y1="116" x2="220" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410" y1="116" x2="540" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="255" y="128" text-anchor="middle" font-size="10" fill="#475569">&lt; Netanya</text>
<text x="505" y="128" text-anchor="middle" font-size="10" fill="#475569">&#8805; Netanya</text>
<rect x="140" y="146" width="140" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="210" y="163" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0f172a">Branch A</text>
<text x="210" y="180" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475569">Ashdod, Haifa</text>
<rect x="480" y="146" width="140" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="550" y="163" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0f172a">Branch B</text>
<text x="550" y="180" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475569">Netanya, Tel Aviv</text>
<line x1="175" y1="192" x2="140" y2="216" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="255" y1="192" x2="280" y2="216" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="515" y1="192" x2="480" y2="216" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="595" y1="192" x2="620" y2="216" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140" y="204" text-anchor="middle" font-size="10" fill="#475569">&lt; Haifa</text>
<text x="290" y="204" text-anchor="middle" font-size="10" fill="#475569">&#8805; Haifa</text>
<text x="480" y="204" text-anchor="middle" font-size="10" fill="#475569">&lt; Tel Aviv</text>
<text x="630" y="204" text-anchor="middle" font-size="10" fill="#475569">&#8805; Tel Aviv</text>
<rect x="50" y="216" width="150" height="56" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<text x="125" y="236" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#134e4a">1. Ashdod</text>
<text x="125" y="254" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0f766e">&#8594; T5</text>
<rect x="220" y="216" width="150" height="56" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<text x="295" y="236" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#134e4a">2. Haifa</text>
<text x="295" y="254" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0f766e">&#8594; T7</text>
<rect x="390" y="216" width="150" height="56" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<text x="465" y="236" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#134e4a">3. Netanya</text>
<text x="465" y="254" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0f766e">&#8594; T1</text>
<rect x="560" y="216" width="150" height="56" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<text x="635" y="236" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#134e4a">4. Tel Aviv</text>
<text x="635" y="254" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0f766e">&#8594; T9</text>
<line x1="200" y1="244" x2="220" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="370" y1="244" x2="390" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540" y1="244" x2="560" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="340" width="700" height="150" rx="20" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="46" y="364" font-size="14" font-weight="bold" fill="#78350f">properties table (heap)</text>
<text x="46" y="380" font-size="12" fill="#92680e">Insertion order, not sorted</text>
<rect x="250" y="410" width="100" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="300" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0f172a">T1</text>
<text x="300" y="444" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475569">Netanya</text>
<rect x="370" y="410" width="100" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="420" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0f172a">T9</text>
<text x="420" y="444" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475569">Tel Aviv</text>
<rect x="490" y="410" width="100" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="540" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0f172a">T5</text>
<text x="540" y="444" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475569">Ashdod</text>
<rect x="610" y="410" width="100" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="660" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0f172a">T7</text>
<text x="660" y="444" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475569">Haifa</text>
<path d="M125 272 L125 312 L540 312 L540 410" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M295 272 L295 318 L660 318 L660 410" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M465 272 L465 324 L300 324 L300 410" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M635 272 L635 330 L420 330 L420 410" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
