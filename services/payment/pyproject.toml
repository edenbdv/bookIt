[project]
name = "payment"
version = "0.1.0"
description = "BookIt's Payment service -- charges, refunds, the provider's webhook and reconcile, on its own database (BOOK-65)"
authors = [
    { name = "Eden Ben David" }
]
requires-python = ">=3.12"
# only what Payment itself uses -- no Celery, Redis, bcrypt... (those are Booking's).
# Same lower bounds as the root pyproject, so the shared uv.lock resolves one
# version of each for every service.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyjwt>=2.9",
    "confluent-kafka>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.19.1",
    "alembic-postgresql-enum>=1.10.0",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
