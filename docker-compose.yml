services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookit
      POSTGRES_PASSWORD: bookit
      POSTGRES_DB: bookit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BOOK-45: local SMTP test double, not a real mail server -- see
  # docs/jobs/email-basics.md section 3 and docs/jobs/worker-decisions.md
  # section 8. Catches every message `worker` sends and shows it at
  # http://localhost:8025 -- nothing here is ever actually delivered.
  # Only `worker` depends on this: `app` never touches mail directly, it
  # only enqueues the job (the whole point of BOOK-45).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP -- what `worker` sends to
      - "8025:8025"   # web UI -- where you look at what was "sent"

  app:
    build: .
    environment:
      APP_NAME: BookIt
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://bookit:bookit@db:5432/bookit
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/code
      - /code/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; exit(0 if u.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # BOOK-44: same image as `app`, different command -- a separate process/
  # container so it scales and restarts independently of the API. See
  # docs/jobs/worker-decisions.md section 6 ("does the worker ship in the
  # same image as the app?") and docs/jobs/background-jobs-basics.md's
  # "worker on a queue" section for why this isn't run inside `app` instead.
  #
  # DATABASE_URL added for BOOK-46 (the expiry job) -- REDIS_URL still
  # unneeded, since nothing here touches the cache yet.
  worker:
    build: .
    command: uv run --no-dev celery -A app.worker worker --loglevel=info
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      # BOOK-46: the first real DB-touching job landed, so this is now needed
      # -- see the comment this replaces, above the `app` service.
      DATABASE_URL: postgresql+asyncpg://bookit:bookit@db:5432/bookit
      # BOOK-45: container networking needs the service name, not `localhost`
      # -- same reason DATABASE_URL above isn't Settings' own default either.
      SMTP_HOST: mailhog
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - .:/code
      - /code/.venv

  # BOOK-46. Only enqueues on a schedule (app.conf.beat_schedule,
  # core/jobs/celery_app.py) -- never executes anything itself, `worker`
  # still does that (docs/jobs/celery-basics.md section 9). Needs the
  # broker, not the database.
  #
  # Run exactly one instance -- never `docker compose up --scale beat=N`.
  # Unlike `worker`, beat is not safe to scale: it has no deduplication, so
  # two instances would each independently decide "it's time" and both
  # enqueue, firing the same scheduled task twice.
  #
  # --schedule points beat's own state file (last-run timestamps) at /tmp,
  # inside the container -- not the bind-mounted repo -- so it doesn't leave
  # an untracked file in the actual working directory on the host.
  beat:
    build: .
    command: uv run --no-dev celery -A app.worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/code
      - /code/.venv

volumes:
  pgdata:
