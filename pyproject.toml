[project]
name = "bookit"
version = "0.1.0"
description = "BookIt — booking platform backend (modular monolith)"
authors = [
    { name = "Eden Ben David" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "alembic>=1.19.1",
    "alembic-postgresql-enum>=1.10.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
