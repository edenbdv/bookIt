# BOOK-65: Payment's own Alembic setup -- separate from the monolith's
# alembic.ini, for Payment's own database. Usually run via
# `python -m payment.migrate` (creates the database first); directly:
#
#     uv run alembic -c services/payment/src/payment/alembic.ini upgrade head
#
# The URL is never hardcoded here: env.py reads PAYMENT_DATABASE_URL from settings.
# No prepend_sys_path: `payment` is an installed workspace package, like Notification.

[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
