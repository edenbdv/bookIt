# BOOK-64 step 4c: Notification's own Alembic setup -- separate from the
# monolith's alembic.ini, for Notification's own database. Run from the repo
# root with:
#
#     uv run alembic -c app/notification/alembic.ini upgrade head
#
# The database URL is never hardcoded here: env.py reads it from settings
# (NOTIFICATION_DATABASE_URL), same as the monolith's alembic/env.py does.

[alembic]
script_location = %(here)s/migrations
# repo root, so `import app...` works from env.py
prepend_sys_path = %(here)s/../..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
