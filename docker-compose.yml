services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookit
      POSTGRES_PASSWORD: bookit
      POSTGRES_DB: bookit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # Fixed hostname -- RabbitMQ's node name (and therefore its data
    # directory, /var/lib/rabbitmq/mnesia/rabbit@<hostname>) is derived from
    # it. Without this, Docker gives the container a new hostname (its own
    # container id) every time it's recreated, so the volume below would
    # just accumulate orphaned data under a different node name each time
    # instead of ever being found again.
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BOOK-48. Event bus for BookingConfirmed/BookingCancelled -- separate from
  # `rabbitmq` on purpose (docs/jobs/worker-decisions.md §3, docs/jobs/kafka-basics.md).
  # KRaft mode: Kafka is its own controller, no ZooKeeper container needed.
  # Two listeners, same split as db/redis (README's "why the difference
  # matters"): PLAINTEXT for other containers (`kafka:9092`), PLAINTEXT_HOST
  # for the host machine (`localhost:9094`) -- a broker only ever advertises
  # one hostname per listener, so both have to exist to be reachable from
  # both places.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # explicit topic creation only (BOOK-48's topic-design decision is
      # deliberate, not "whatever a producer happens to touch first")
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      # /tmp/kafka-logs holds both regular topic data AND KRaft's own
      # cluster metadata (meta.properties -- cluster.id/node.id -- confirmed
      # live to live in the same directory), so one volume covers both.
      - kafka-data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # BOOK-48. Kafka has no built-in web UI the way RabbitMQ does -- this is
  # the same role MailHog/RabbitMQ's management UI play for their brokers,
  # just a separate tool since Kafka doesn't ship one itself. Reaches Kafka
  # over the internal PLAINTEXT listener (`kafka:9092`), same as `worker` will.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # BOOK-45: local SMTP test double, not a real mail server -- see
  # docs/jobs/email-basics.md section 3 and docs/jobs/worker-decisions.md
  # section 8. Catches every message `worker` sends and shows it at
  # http://localhost:8025 -- nothing here is ever actually delivered.
  # Only `worker` depends on this: `app` never touches mail directly, it
  # only enqueues the job (the whole point of BOOK-45).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP -- what `worker` sends to
      - "8025:8025"   # web UI -- where you look at what was "sent"

  app:
    build: .
    environment:
      APP_NAME: BookIt
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://bookit:bookit@db:5432/bookit
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/code
      - /code/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; exit(0 if u.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # BOOK-44: same image as `app`, different command -- a separate process/
  # container so it scales and restarts independently of the API. See
  # docs/jobs/worker-decisions.md section 6 ("does the worker ship in the
  # same image as the app?") and docs/jobs/background-jobs-basics.md's
  # "worker on a queue" section for why this isn't run inside `app` instead.
  #
  # DATABASE_URL added for BOOK-46 (the expiry job) -- REDIS_URL still
  # unneeded, since nothing here touches the cache yet.
  worker:
    build: .
    command: uv run --no-dev celery -A app.worker worker --loglevel=info
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      # BOOK-46: the first real DB-touching job landed, so this is now needed
      # -- see the comment this replaces, above the `app` service.
      DATABASE_URL: postgresql+asyncpg://bookit:bookit@db:5432/bookit
      # BOOK-45: container networking needs the service name, not `localhost`
      # -- same reason DATABASE_URL above isn't Settings' own default either.
      SMTP_HOST: mailhog
      # BOOK-50: the outbox relay's Kafka producer -- same reasoning, the
      # internal PLAINTEXT listener (`kafka:9092`), not the host-published one.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
      kafka:
        condition: service_healthy
    volumes:
      - .:/code
      - /code/.venv

  # BOOK-46. Only enqueues on a schedule (app.conf.beat_schedule,
  # core/jobs/celery_app.py) -- never executes anything itself, `worker`
  # still does that (docs/jobs/celery-basics.md section 9). Needs the
  # broker, not the database.
  #
  # Run exactly one instance -- never `docker compose up --scale beat=N`.
  # Unlike `worker`, beat is not safe to scale: it has no deduplication, so
  # two instances would each independently decide "it's time" and both
  # enqueue, firing the same scheduled task twice.
  #
  # --schedule points beat's own state file (last-run timestamps) at /tmp,
  # inside the container -- not the bind-mounted repo -- so it doesn't leave
  # an untracked file in the actual working directory on the host.
  beat:
    build: .
    command: uv run --no-dev celery -A app.worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/code
      - /code/.venv

  # BOOK-51. Its own process, deliberately not folded into `worker` or run as
  # a Celery task -- a Kafka consumer group needs a real, continuously
  # running client, which Celery's task-pull model has no equivalent of
  # (worker-decisions.md §12). No CELERY_BROKER_URL / rabbitmq dependency --
  # this never touches RabbitMQ at all.
  notification-consumer:
    build: .
    command: uv run --no-dev python -m app.notification_consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://bookit:bookit@db:5432/bookit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: mailhog
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - .:/code
      - /code/.venv

volumes:
  pgdata:
  rabbitmq-data:
  kafka-data:
