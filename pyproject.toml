[project]
name = "bookit"
version = "0.1.0"
description = "BookIt — booking platform backend (modular monolith)"
authors = [
    { name = "Eden Ben David" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "alembic>=1.19.1",
    "alembic-postgresql-enum>=1.10.0",
    "email-validator>=2.3.0",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# app/ isn't an installed package ([tool.uv] package = false above) --
# pytest doesn't put the repo root on sys.path on its own, so imports
# like `from app.reservation.models import ...` fail without this.
pythonpath = ["."]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.1",
    "ruff>=0.16.2",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# Depends(...) as a default argument is FastAPI's own dependency-injection
# pattern, not the mutable-default-argument bug B008 normally catches.
extend-immutable-calls = ["fastapi.Depends"]

[tool.black]
line-length = 100
target-version = ["py312"]
